<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Transition</title>
<style type="text/css">

div {
	height: 150px;
	width: 150px;
	background-color: #40739e;
	color: white;
	line-height: 150px;
	text-align: center;
	font-size: 24px;
	margin: 20px;
	margin-right: auto;
	margin-left: auto;
	transition: transform 1s;
}

.scale:hover {
	transform: scale(1.2);
}

.translate:hover {
	transform: translateX(320px);
}

.rotate:hover {
	transform: rotate(180deg);
}

.skew:hover {
	transform: skew(20deg);
}

img {
	width: 300px;
	display: block;
	margin: auto;
	margin-top: 25px;
	transition: transform 2s;
}

/* img:hover { */
	/* transform: translate(-500px, 200px); */
	/* transform: scale(2); */
	/* transform: rotate(200grad); */
	/* transform: skew(20deg, 40deg); */
/* } */

.second {
	transform-origin: top left;
	margin-bottom: 0;
}

.first:hover, .second:hover {
	transform: rotate(30deg);
}

div:hover {
	transform: rotate(45deg);
}

.top {
	transform-origin: top;
}

.right {
	transform-origin: right;
}

.left {
	transform-origin: left;
}

.bottom {
	transform-origin: bottom;
}

.top-right {
	transform-origin: top right;
}

.top-left {
	transform-origin: top left;
}

.bottom-right {
	transform-origin: bottom right;
}

.bottom-left {
	transform-origin: bottom left;
}

</style>
</head>

<body>

	<div class="scale">scale me</div>
	<div class="translate">translate me</div>
	<div class="rotate">rotate me</div>
	<div class="skew">skew me</div>

	<img src="../cat.jpg" alt="" class="first">
	<img src="../cat.jpg" alt="" class="second">

	<div class="top">top</div>
	<div class="right">right</div>
	<div class="bottom">bottom</div>
	<div class="left">left</div>
	<div class="top-right">top right</div>
	<div class="bottom-right">bottom right</div>
	<div class="bottom-left">bottom left</div>
	<div class="top-left">top left</div>

</body>
</html>
